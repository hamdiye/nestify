name: CI/CD Pipeline - Deploy Nestify

on:
  push:
    branches: [ "main" ] # veya "master"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:latest
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Backend Build & Push
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend  # Backend klasörünüzün yolu
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      # 2. Frontend Build & Push
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # Frontend klasörünüzün yolu
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "--- GHCR Login ---"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "--- Pulling latest images ---"
            docker pull ${{ env.BACKEND_IMAGE }}
            docker pull ${{ env.FRONTEND_IMAGE }}

            echo "--- Recreating Backend Container ---"
            docker rm -f nestify || true
            docker run -d \
              --name nestify \
              --network nestify-net \
              --restart unless-stopped \
              -p 3001:8080 \
              -e SPRING_DATASOURCE_URL="jdbc:postgresql://nestify-db:5432/nestify" \
              -e SPRING_DATASOURCE_USERNAME="postgres" \
              -e SPRING_DATASOURCE_PASSWORD="nestify_sifre123" \
              ${{ env.BACKEND_IMAGE }}

            echo "--- Recreating Frontend Container ---"
            docker rm -f nestify-frontend || true
            docker run -d \
              --name nestify-frontend \
              --network nestify-net \
              --restart unless-stopped \
              -p 3002:80 \
              ${{ env.FRONTEND_IMAGE }}

            echo "--- Deployment Finished Successfully! ---"