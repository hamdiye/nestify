name: Deploy Nestify Monorepo

on:
  push:
    branches: [ "main" ] # Eğer varsayılan dalınız "master" ise "master" yapın

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:latest
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:latest

jobs:
  # 1. Hangi tarafın değiştiğini tespit et
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'src/**'
              - 'pom.xml'
              - 'Dockerfile'

  # 2. Backend Değiştiyse: Kök dizini (.) derle ve GHCR'a gönder
  build-backend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.run_number == 1 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .              # <-- Backend artık ana (root) dizin
          file: ./Dockerfile      # <-- Kök dizindeki Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

  # 3. Frontend Değiştiyse: frontend/ klasörünü derle ve GHCR'a gönder
  build-frontend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.run_number == 1 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend     # <-- Frontend kendi klasöründe
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

  # 4. Sunucuya Bağlanıp Konteynerleri Güncelle
  deploy:
    needs: [detect-changes, build-backend, build-frontend]
    if: always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Backend güncellendiyse konteyneri yenile
            if [ "${{ needs.build-backend.result }}" == "success" ]; then
              echo "Updating Backend Container..."
              docker pull ${{ env.BACKEND_IMAGE }}
              docker rm -f nestify || true
              docker run -d \
                --name nestify \
                --network nestify-net \
                --restart unless-stopped \
                -p 3001:8080 \
                -e SPRING_DATASOURCE_URL="jdbc:postgresql://nestify-db:5432/nestify" \
                -e SPRING_DATASOURCE_USERNAME="postgres" \
                -e SPRING_DATASOURCE_PASSWORD="nestify_sifre123" \
                ${{ env.BACKEND_IMAGE }}
            fi

            # Frontend güncellendiyse konteyneri yenile
            if [ "${{ needs.build-frontend.result }}" == "success" ]; then
              echo "Updating Frontend Container..."
              docker pull ${{ env.FRONTEND_IMAGE }}
              docker rm -f nestify-frontend || true
              docker run -d \
                --name nestify-frontend \
                --network nestify-net \
                --restart unless-stopped \
                -p 3002:80 \
                ${{ env.FRONTEND_IMAGE }}
            fi

            echo "Deployment completed successfully!"